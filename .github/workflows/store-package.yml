name: Store package

# Builds the Microsoft Store (MSIX/AppX) package on demand. AppX can only be
# built on Windows, hence the CI runner. The package is NOT published anywhere:
# it lands as a workflow artifact, to be uploaded manually in Partner Center
# (the Store signs it during ingestion — no certificate involved).
#
# The package identity comes from the STORE_IDENTITY_NAME / STORE_PUBLISHER /
# STORE_PUBLISHER_DISPLAY repository secrets (Partner Center → Product
# identity), so the values never appear in the repo or in build logs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The FamilySearch AppKey must be injected here too — electron-vite inlines
      # import.meta.env.MAIN_VITE_* at BUILD time, so a Store package built
      # without it ships with the integration silently dormant while the
      # GitHub-Release build has it. Keep these three in sync with release.yml.
      - name: Build MSIX (AppX) package
        shell: bash
        env:
          MAIN_VITE_FS_CLIENT_ID: ${{ secrets.FS_CLIENT_ID }}
          MAIN_VITE_FS_ENV: production
          MAIN_VITE_FS_REDIRECT_URI: http://127.0.0.1:4321/auth/callback
        run: |
          npm run dist:win:store -- \
            -c.appx.identityName="${{ secrets.STORE_IDENTITY_NAME }}" \
            -c.appx.publisher="${{ secrets.STORE_PUBLISHER }}" \
            -c.appx.publisherDisplayName="${{ secrets.STORE_PUBLISHER_DISPLAY }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeMonk-store-appx
          path: release/*.appx
          if-no-files-found: error
