name: Release

# Push a tag like v0.14.0 to build the Windows installer and the Linux AppImage,
# upload both to a GitHub Release, and publish it with the localized notes that
# the in-app updater reads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the draft release up front so the parallel build jobs only upload to
  # it (avoids a race where both try to create the same release).
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Only here to read package.json for the version guard below. Nothing in
      # this job runs git, so the contents: write token need not land on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The tag decides which release-notes file finalize picks up; package.json
      # decides the version electron-builder stamps into the installers. Nothing
      # tied the two together, so `git tag v1.9.1` on a 1.9.0 manifest used to
      # build and publish silently under the wrong name. Fail before the draft
      # exists, so a mismatch leaves nothing to clean up.
      #
      # `node` is preinstalled on ubuntu-latest, so this needs no setup-node.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}. Bump package.json to ${TAG_VERSION} (and add .github/release-notes/${TAG_VERSION}.md), or delete the tag and retag the right commit."
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${PKG_VERSION}."

      - name: Create draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "TreeMonk ${TAG#v}" --notes "Build in progress…"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          # Apple Silicon (arm64) .dmg — unsigned (see electron-builder.yml mac).
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:win / dist:linux already fetch the bundled assets, build the app and
      # run electron-builder; the trailing args turn on GitHub publishing.
      #
      # The FamilySearch AppKey is baked in at build time (electron-vite inlines
      # import.meta.env.MAIN_VITE_*). It is a PKCE public client id, not a secret,
      # but it is kept in a repository secret so it never sits in git. When the
      # secret is absent the value is empty and the whole FamilySearch integration
      # stays dormant — isFamilySearchConfigured() is false and no FamilySearch UI
      # appears. The public build is READ-ONLY towards FamilySearch: it imports and
      # syncs FROM the tree and never writes back.
      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_FS_CLIENT_ID: ${{ secrets.FS_CLIENT_ID }}
          MAIN_VITE_FS_ENV: production
          MAIN_VITE_FS_REDIRECT_URI: http://127.0.0.1:4321/auth/callback

  # Build the LOCAL web app (treemonk.eu/demo): the full TreeMonk running in the
  # browser, with the database persisted in the visitor's OWN browser storage
  # (OPFS/IndexedDB) — no cloud, no account, nothing leaves their machine. The
  # tarball keeps the historical `treemonk-demo` asset name because the VPS pulls
  # that exact asset (no credentials leave the VPS), so the live site
  # auto-updates with every release.
  web-demo:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate the bundled sample DB from the CURRENT schema.ts every release
      # (the web app offers it as the optional "load sample family" starter), so
      # it can never go stale against new columns/tables.
      - name: Regenerate sample database
        run: node scripts/build-demo-db.mjs

      - name: Build local web app
        run: npx vite build --config vite.web.config.ts

      - name: Package web bundle
        run: tar -czf treemonk-demo.tar.gz -C out-web .

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" treemonk-demo.tar.gz --clobber

  # All artifacts uploaded → set the localized release notes and publish.
  finalize:
    needs: [build, web-demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release with localized notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE=".github/release-notes/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest
          fi
